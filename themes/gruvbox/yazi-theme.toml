# Olikub Yazi theme: gruvbox
# Generated from the Olikub gruvbox palette; applied by `olikub theme`.

[app]
overall = { bg = "#282828" }

[mgr]
cwd = { fg = "#7daea3" }
find_keyword = { fg = "#d8a657", bold = true }
find_position = { fg = "#d3869b" }
symlink_target = { fg = "#89b482" }
marker_copied = { fg = "#282828", bg = "#a9b665" }
marker_cut = { fg = "#282828", bg = "#ea6962" }
marker_marked = { fg = "#282828", bg = "#d8a657" }
marker_selected = { fg = "#282828", bg = "#7daea3" }
count_copied = { fg = "#282828", bg = "#a9b665" }
count_cut = { fg = "#282828", bg = "#ea6962" }
count_selected = { fg = "#282828", bg = "#7daea3" }
border_symbol = "│"
border_style = { fg = "#3c3836" }

[indicator]
parent = { fg = "#3c3836" }
current = { fg = "#7daea3" }
preview = { fg = "#d8a657" }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#282828", bg = "#7daea3", bold = true }
inactive = { fg = "#d4be98", bg = "#3c3836" }
sep_inner = { open = "█", close = "█" }

[mode]
normal_main = { fg = "#282828", bg = "#7daea3", bold = true }
normal_alt = { fg = "#7daea3", bg = "#3c3836" }
select_main = { fg = "#282828", bg = "#d3869b", bold = true }
select_alt = { fg = "#d3869b", bg = "#3c3836" }
unset_main = { fg = "#282828", bg = "#ea6962", bold = true }
unset_alt = { fg = "#ea6962", bg = "#3c3836" }

[status]
overall = { fg = "#d4be98", bg = "#3c3836" }
perm_type = { fg = "#7daea3" }
perm_read = { fg = "#a9b665" }
perm_write = { fg = "#d8a657" }
perm_exec = { fg = "#ea6962" }
perm_sep = { fg = "#504945" }
progress_label = { fg = "#282828", bg = "#d4be98", bold = true }
progress_normal = { fg = "#282828", bg = "#7daea3" }
progress_error = { fg = "#282828", bg = "#ea6962" }

[which]
border = { fg = "#3c3836" }
mask = { bg = "#3c3836" }
cand = { fg = "#89b482" }
rest = { fg = "#d4be98" }
desc = { fg = "#d3869b" }
separator = " -> "
separator_style = { fg = "#504945" }

[confirm]
border = { fg = "#3c3836" }
title = { fg = "#7daea3" }
body = { fg = "#d4be98" }
list = { fg = "#d4be98" }
btn_yes = { fg = "#282828", bg = "#7daea3", bold = true }
btn_no = { fg = "#282828", bg = "#ea6962" }

[notify]
title_info = { fg = "#89b482" }
title_warn = { fg = "#d8a657" }
title_error = { fg = "#ea6962" }

[pick]
border = { fg = "#3c3836" }
active = { fg = "#282828", bg = "#7daea3", bold = true }
inactive = { fg = "#d4be98" }

[input]
border = { fg = "#3c3836" }
title = { fg = "#7daea3" }
value = { fg = "#d4be98" }
selected = { fg = "#282828", bg = "#7daea3" }

[cmp]
border = { fg = "#3c3836" }
active = { fg = "#282828", bg = "#7daea3", bold = true }
inactive = { fg = "#d4be98" }

[tasks]
border = { fg = "#3c3836" }
title = { fg = "#7daea3" }
hovered = { fg = "#282828", bg = "#7daea3" }

[help]
border = { fg = "#3c3836" }
chord = { fg = "#89b482" }
action = { fg = "#d4be98" }
hovered = { fg = "#282828", bg = "#7daea3" }

[filetype]
rules = [
	{ mime = "image/*", fg = "#d3869b" },
	{ mime = "{audio,video}/*", fg = "#d8a657" },
	{ mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,deb,rpm}", fg = "#ea6962" },
	{ mime = "inode/empty", fg = "#89b482" },
	{ url = "*", is = "orphan", fg = "#ea6962" },
	{ url = "*/", fg = "#7daea3" },
]